name: mortgage_analytics
version: "1.0.0"
profile: mortgage_analytics

models:
  mortgage_analytics:
    staging:
      # Staging reads the raw text files; tables avoid re-parsing them for every downstream query.
      +materialized: table
    marts:
      +materialized: table
    exports:
      +materialized: external
      +format: csv

vars:
  # Export rows built from fewer loans or episodes than this are left out, so no published
  # number describes just a handful of loans.
  min_cell_size: 10
