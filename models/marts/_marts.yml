models:
  - name: dim_loans
    description: One row per loan, with origination details, risk bands, and how the loan ended.
    columns:
      - name: loan_id
        data_tests:
          - unique
          - not_null
      - name: outcome
        description: >-
          active, paid off (before the scheduled final payment), matured (paid off at or after the
          scheduled final payment), defaulted (third-party sale, short sale or charge-off, or REO
          disposition), or sold or repurchased (whole loan sale, reperforming loan sale, or defect
          repurchase).
      - name: outcome_month
        description: Reporting month in which the loan's termination was reported. Null for active loans.

  - name: fct_loan_months
    description: One row per loan per month.
    columns:
      - name: delinquency_status
        data_tests:
          - not_null
      - name: previous_upb
        description: >-
          Balance at the end of the prior calendar month, which is the balance at the start of
          this one. Null in a loan's first month and after a gap in Freddie Mac's reporting.
      - name: previous_delinquency_status
        description: >-
          Status in the prior calendar month. Null in a loan's first month and after a gap in
          Freddie Mac's reporting.

  - name: fct_delinquency_episodes
    description: >-
      One row per stretch of consecutive delinquent months (30+ days late or REO) in a loan's
      history. A loan can have several episodes.
    columns:
      - name: start_month
        description: First delinquent month of the episode.
      - name: end_month
        description: Last delinquent month of the episode.
      - name: worst_delinquency_status
        description: Most severe status reached during the episode.
      - name: outcome
        description: >-
          cured (returned to current, by any route including a modification or payment deferral),
          ongoing (still delinquent at the end of the data), or the loan's termination outcome if
          it ended during the episode or in the month right after.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [cured, ongoing, paid off, matured, defaulted, sold or repurchased]
      - name: outcome_month
        description: >-
          First current month for a cure, the loan's outcome month for a termination, null for an
          ongoing episode.
      - name: months_to_outcome
        description: Months from the start of the episode to its outcome month.

  - name: prepayment_by_vintage
    description: >-
      One row per origination year per month. Prepayment counts only loans paid off in full
      before their scheduled final payment. Partial prepayments (curtailments) are not included,
      so these rates run lower than a conventional CPR, which counts all unscheduled principal.
    columns:
      - name: smm
        description: >-
          Single monthly mortality: the starting balance of loans paid off this month divided by
          the starting balance of all loans active this month.
      - name: cpr
        description: Conditional prepayment rate, the annualized SMM. 1 - (1 - smm)^12.

  - name: risk_band_performance
    description: >-
      One row per origination year, credit score band, and loan-to-value band. Rates cover each
      loan's first 60 months after its first payment, so older and newer origination years are
      compared over the same window. Loans without 60 months of data yet are left out.
    columns:
      - name: serious_delinquency_rate_5yr
        description: Share of loans that were 90+ days delinquent or in REO within 60 months.
      - name: default_rate_5yr
        description: >-
          Share of loans that defaulted within 60 months, dated by when the default was reported
          (usually the property sale), which comes well after the first missed payment.
