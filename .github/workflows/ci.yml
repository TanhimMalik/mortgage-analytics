name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    env:
      # The real Freddie Mac files can't be redistributed, so CI runs on the fake loans.
      FREDDIE_DATA_DIR: fixtures
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv sync --locked
      - run: uv run dbt build
